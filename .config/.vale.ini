StylesPath = styles
MinAlertLevel = suggestion
Vocab = Tech

Packages = Google, proselint, write-good

[*.{md}]
# ^ This section applies to Markdown files only.
#
# You can change (or add) file extensions here
# to apply these settings to other file types.
#
# For example, to apply these settings to both
# Markdown and reStructuredText:
#
# [*.{md,rst}]
BasedOnStyles = Vale, Google, proselint, write-good

# Skip URLs entirely (including ones wrapped in bold/italics, which
# aren't recognized as real links/autolinks and would otherwise be
# scanned word-by-word by Vale.Terms and other rules).
TokenIgnores = ((?<!\]\()https?://[^\s`]+)