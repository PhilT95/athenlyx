# Add this block inside the existing server {} block in your nginx site config.
# webhook listens locally on port 9000; nginx forwards only /hooks/ to it.
# All other traffic (the actual site) remains unaffected.

location /hooks/ {
    proxy_pass         http://127.0.0.1:9000/hooks/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Forward the deploy token header to webhook
    proxy_set_header   X-Deploy-Token    $http_x_deploy_token;
}
