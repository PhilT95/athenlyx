# Deploy workflow — manually triggered from the GitHub Actions tab.
#
# IMPORTANT: This file must be placed at .github/workflows/deploy.yml to be active.
# It is kept here for review before being moved into place.
#
# Required GitHub secret:
#   DEPLOY_TOKEN — a strong random string, must match the value in /etc/webhook/hooks.yaml
#                  on the server. Generate with: openssl rand -hex 32
#
# Usage:
#   1. Confirm that Build Check, Vale Linter, and Security Check all passed on main.
#   2. Go to Actions → Deploy → Run workflow → select branch "main" → Run workflow.
#   This workflow will re-verify all required checks before calling the deploy endpoint.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Verify all other pipelines passed before running."
        required: false
        default: "yes"

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      actions: read

    steps:
      # Verify that all required workflows passed for the latest commit on main
      # before calling the deploy webhook.
      - name: Verify all required checks passed
        uses: actions/github-script@v7
        with:
          script: |
            const required = ['Build Check', 'Vale Linter', 'Security Check'];

            // Resolve the current HEAD SHA of the branch this was dispatched on.
            const { data: branch } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: context.ref.replace('refs/heads/', '')
            });
            const sha = branch.commit.sha;
            core.info(`Checking workflows for commit ${sha} on ${context.ref}`);

            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: sha,
              per_page: 100
            });

            for (const name of required) {
              const run = data.workflow_runs.find(r => r.name === name);
              if (!run) {
                core.setFailed(`Required workflow "${name}" has no run for commit ${sha}.`);
              } else if (run.conclusion !== 'success') {
                core.setFailed(`Required workflow "${name}" did not pass (conclusion: ${run.conclusion}).`);
              } else {
                core.info(`"${name}" passed.`);
              }
            }

      - name: Trigger deploy webhook
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          curl -fsS -X POST https://athenlyx.com/hooks/deploy \
            -H "X-Deploy-Token: ${DEPLOY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{}'
