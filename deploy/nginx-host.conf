# Host nginx configuration for the Docker setup of athenlyx.com
#
# Install:
#   1. Copy this file to /etc/nginx/sites-enabled/athenlyx.com.conf
#      (or /etc/nginx/conf.d/ if that is where your nginx.conf includes from).
#   2. Check the ports below against APP_PORT and UPDATER_PORT in the .env file
#      next to compose.yaml, and the certificate paths against your certbot setup.
#   3. nginx -t && systemctl reload nginx
#
# Traffic:
#   /hooks/*  ->  updater container   (called by the GitHub deploy workflow)
#   /*        ->  web container       (static site; it forwards /api/ to the API itself)
#
# The web container already compresses responses, sets cache headers for assets
# and adds the CORS headers for /api/. This file does not repeat them, so no header
# is sent twice. It handles TLS, security headers, logging and rate limiting.
#
# Behind a WAF (for example SafeLine): allow POST and GET requests to /hooks/*
# there, and do not apply challenges or aggressive rate limits to them.


# ── Upstreams (the containers only listen on 127.0.0.1) ─────────────────────
upstream athenlyx_site {
    server 127.0.0.1:6559;   # APP_PORT
}

upstream athenlyx_updater {
    server 127.0.0.1:6560;   # UPDATER_PORT
}

# Rate limit for the update endpoint. Normal use is a few requests per update
# (one trigger and a status request every 15 seconds while it runs).
limit_req_zone $binary_remote_addr zone=athenlyx_hooks:1m rate=30r/m;


# ── HTTP: redirect everything to HTTPS ──────────────────────────────────────
server {
    listen 80;
    server_name athenlyx.com;

    return 301 https://$host$request_uri;
}


# ── HTTPS ───────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name athenlyx.com;

    access_log /var/log/nginx/athenlyx.com:443.access.log;
    error_log  /var/log/nginx/athenlyx.com:443.error.log;

    ssl_certificate     /etc/letsencrypt/live/athenlyx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/athenlyx.com/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_stapling on;
    ssl_stapling_verify on;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    # If a WAF such as SafeLine is in front of this nginx, log and rate limit the
    # real client instead of the WAF. Replace the address with the WAF's address.
    # set_real_ip_from 192.0.2.10;
    # real_ip_header   X-Forwarded-For;

    # Never expose the Docker setup files, should the document root ever change.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # ── Update endpoint ─────────────────────────────────────────────────────
    # Authenticated by the application (HMAC signature and timestamp).
    location /hooks/ {
        limit_except GET POST { deny all; }
        limit_req            zone=athenlyx_hooks burst=10 nodelay;
        client_max_body_size 4k;

        proxy_pass         http://athenlyx_updater;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # The request returns immediately; the build runs in the background.
        proxy_read_timeout 30s;
    }

    # ── Website and API ─────────────────────────────────────────────────────
    location / {
        proxy_pass         http://athenlyx_site;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
