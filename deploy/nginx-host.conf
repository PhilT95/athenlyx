# Reference configuration for the HOST nginx in front of the Docker setup.
#
# Place the upstream and location blocks inside the existing server {} block of
# your site (the one that terminates TLS). Adapt the ports to APP_PORT and
# UPDATER_PORT from the .env file next to compose.yaml.
#
# After changing it, test and reload:
#   nginx -t && systemctl reload nginx
#
# If a WAF (for example SafeLine) sits in front, allow POST and GET requests to
# /hooks/* through, and do not apply challenges or aggressive rate limits there.

upstream athenlyx_site {
    server 127.0.0.1:6559;   # APP_PORT: web container (static site and /api/)
}

upstream athenlyx_updater {
    server 127.0.0.1:6560;   # UPDATER_PORT: update endpoint
}

# ── Update endpoint, called by the GitHub deploy workflow ───────────────────
# Authenticated by the application (HMAC signature), not by nginx.
location /hooks/ {
    proxy_pass         http://athenlyx_updater;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # The update request returns immediately; building happens in the background.
    proxy_read_timeout 30s;
}

# ── Website and public content API ──────────────────────────────────────────
# The web container serves the static files and forwards /api/ to the API.
location / {
    proxy_pass         http://athenlyx_site;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}
