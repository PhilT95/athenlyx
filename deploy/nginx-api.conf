# Replaces deploy/nginx-webhook.conf.
#
# Add these location blocks inside your existing server {} block.
# The FastAPI app (uvicorn) listens locally on port 8000 and handles both
# the deploy webhook and the public content API.
#
# After adding, test and reload nginx:
#   nginx -t && systemctl reload nginx

# ── Deploy webhook (secured by application; not shown in API docs) ──────────
location /hooks/ {
    proxy_pass         http://127.0.0.1:8000/hooks/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Forward the deploy token to the application.
    proxy_set_header   X-Deploy-Token    $http_x_deploy_token;
}

# ── Public content API ───────────────────────────────────────────────────────
location /api/ {
    proxy_pass         http://127.0.0.1:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Allow bots and AI agents to access the API without CORS restrictions.
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;
}
